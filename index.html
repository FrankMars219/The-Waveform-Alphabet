<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波形字母翻译器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 雪花屏特效层 -->
    <div id="snow-effect" class="hidden"></div>

    <!-- 最终解码黑屏展示层 -->
    <div id="final-screen" class="hidden">
        <h2 id="final-text"></h2>
    </div>

    <!-- 主界面 -->
    <div class="container" id="main-container">
        <h1>The Waveform Alphabet</h1>
        
        <!-- 显示输入内容的文本框（这里将显示图片） -->
        <div id="output-screen" class="screen">
            <!-- 图片会由 JS 动态插入到这里 -->
            <span id="output-content"></span><span class="cursor">_</span>
        </div>

        <!-- 按钮区域：26个字母的按钮 -->
        <div id="keyboard" class="keyboard">
            <!-- JavaScript 会在这里填入按钮 -->
        </div>

        <!-- 操作按钮 -->
        <div class="controls">
            <button id="finish-btn" class="action-btn">Decode </button>
            <button id="delete-btn" class="action-btn">Delete</button>
            <button id="clear-btn" class="action-btn">Empry</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
